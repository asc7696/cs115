function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderCode(code){
  return code.split('\n').map((line,i)=>`<div id="codeLine${i}" data-line="${i}">${esc(line)||' '}</div>`).join('');
}

function parseLiteral(v, env){
  v=String(v).trim();
  if(v==='True')return true;if(v==='False')return false;
  if(/^[-+]?\d+$/.test(v))return Number(v);
  if(/^[-+]?(?:\d+\.\d*|\d*\.\d+)$/.test(v))return Number(v);
  if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))return v.slice(1,-1);
  if(v.startsWith('[')&&v.endsWith(']')){
    const inside=v.slice(1,-1).trim(); if(!inside)return [];
    return inside.split(',').map(x=>parseLiteral(x,env));
  }
  if(env && Object.prototype.hasOwnProperty.call(env,v))return env[v];
  return v;
}
function evalExpr(expr,env,inputVal){
  expr=expr.trim();
  if(expr.startsWith('input('))return inputVal||'';
  if(expr.startsWith('random.choice(')){
    const arr=parseLiteral(expr.slice(expr.indexOf('['),expr.lastIndexOf(']')+1),env);
    return arr[Math.floor(Math.random()*arr.length)];
  }
  if(expr.startsWith('type(')){const x=parseLiteral(expr.slice(5,-1),env);return typeof x==='string'?'str':Number.isInteger(x)?'int':typeof x==='number'?'float':typeof x==='boolean'?'bool':'list'}
  if(expr.startsWith('len(')){const x=parseLiteral(expr.slice(4,-1),env);return x?.length??0}
  if(expr.includes(' + ')){
    const parts=expr.split(' + ');const vals=parts.map(x=>parseLiteral(x,env));
    if(vals.some(x=>typeof x==='string'))return vals.join('');return vals.reduce((a,b)=>a+b,0);
  }
  if(expr.includes(' - ')){const parts=expr.split(' - ');return parts.map(x=>Number(parseLiteral(x,env))).reduce((a,b)=>a-b)}
  return parseLiteral(expr,env);
}
function conditionTrue(cond,env){
  cond=cond.replace(/:$/,'').trim();
  const m=cond.match(/^(.+?)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);
  if(m){const a=evalExpr(m[1],env),b=evalExpr(m[3],env);return m[2]==='=='?a===b:m[2]==='!='?a!==b:m[2]==='>'?a>b:m[2]==='<'?a<b:m[2]==='>='?a>=b:a<=b}
  return !!evalExpr(cond,env);
}
function makeRuntime(){return {lines:units[state.unit].code.split('\n'),pc:0,env:{},output:[],finished:false,loop:{}}}
let runtime=makeRuntime();
function resetProgram(){runtime=makeRuntime();refreshRuntime();}
function markLine(i){document.querySelectorAll('[id^="codeLine"]').forEach(x=>x.classList.remove('currentline'));const el=document.getElementById('codeLine'+i);if(el)el.classList.add('currentline')}
function refreshRuntime(){
  const mv=document.getElementById('memoryView'), out=document.getElementById('runtimeOutput'); if(!mv||!out)return;
  const keys=Object.keys(runtime.env);
  mv.innerHTML=keys.length?keys.map(k=>`<div class="memrow"><span class="memname">${esc(k)}</span><span class="memvalue">${esc(JSON.stringify(runtime.env[k]))}</span></div>`).join(''):'<div class="story">目前沒有變數資料。</div>';
  out.textContent=runtime.output.length?runtime.output.join('\n'):'程式輸出會顯示在這裡……';
  if(runtime.finished){out.textContent+='\n\n✅ 執行完成';}
}
function executeLine(i){
  const line=runtime.lines[i]; const t=line.trim();
  if(!t||t.startsWith('#')){runtime.pc++;return;}
  const input=document.getElementById('runtimeInput')?.value||'';
  let m=t.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
  if(m && !t.startsWith('if ')){runtime.env[m[1]]=evalExpr(m[2],runtime.env,input);runtime.pc++;return;}
  if(t.startsWith('import ')){runtime.pc++;return;}
  m=t.match(/^print\((.*)\)$/); if(m){runtime.output.push(String(evalExpr(m[1],runtime.env,input)));runtime.pc++;return;}
  m=t.match(/^if\s+(.+):$/); if(m){if(conditionTrue(m[1],runtime.env)){runtime.pc++;}else{let j=i+1,depth=0;while(j<runtime.lines.length){let z=runtime.lines[j];if(/^\s{4}/.test(z)){j++;continue}if(z.trim().startsWith('elif ')||z.trim()==='else:'){break}j++}runtime.pc=j;};return;}
  m=t.match(/^elif\s+(.+):$/); if(m){runtime.pc++;return;}
  if(t==='else:'){runtime.pc++;return;}
  m=t.match(/^while\s+(.+):$/); if(m){if(conditionTrue(m[1],runtime.env)){runtime.pc++;}else{let j=i+1;while(j<runtime.lines.length && /^\s{4}/.test(runtime.lines[j]))j++;runtime.pc=j}return;}
  m=t.match(/^for\s+(\w+)\s+in\s+(.+):$/); if(m){const arr=parseLiteral(m[2],runtime.env)||[];const key=i;if(runtime.loop[key]===undefined)runtime.loop[key]={arr,index:0};const L=runtime.loop[key];if(L.index<L.arr.length){runtime.env[m[1]]=L.arr[L.index++];runtime.pc++;}else{delete runtime.loop[key];let j=i+1;while(j<runtime.lines.length && /^\s{4}/.test(runtime.lines[j]))j++;runtime.pc=j}return;}
  // append / simple list mutation
  m=t.match(/^([A-Za-z_]\w*)\.append\((.*)\)$/);if(m){(runtime.env[m[1]]||[]).push(evalExpr(m[2],runtime.env,input));runtime.pc++;return;}
  m=t.match(/^([A-Za-z_]\w*)\s*=\s*\1\s*-\s*(\d+)$/);if(m){runtime.env[m[1]]-=Number(m[2]);runtime.pc++;return;}
  runtime.pc++;
}
function stepProgram(){
  if(runtime.finished){return}
  if(runtime.pc>=runtime.lines.length){runtime.finished=true;refreshRuntime();return}
  markLine(runtime.pc);executeLine(runtime.pc);
  if(runtime.pc>=runtime.lines.length)runtime.finished=true;
  refreshRuntime();
}
function runProgram(){resetProgram();let guard=0;while(!runtime.finished && guard<200){stepProgram();guard++;}if(guard>=200){runtime.output.push('⚠️ 為避免無限迴圈，已暫停執行。');runtime.finished=true;refreshRuntime();}}

/* ===== 🐍 Python 教學逐步執行器 =====
   這是教學用的輕量模擬器，專注在本課程會用到的：
   print / 變數 / input / if / elif / else / while / for in /
   字串 / list / append / random.choice
*/
let demo = {lines:[], current:-1, memory:{}, output:[], waitingInput:false};

function initRunner(){
  const u=units[state.unit];
  demo={lines:u.code.split('\n'),current:-1,memory:{},output:[],waitingInput:false};
  renderRunner();
  setupInputBox();
}

function renderRunner(){
  const box=document.getElementById('codeRunner');
  if(!box)return;
  box.innerHTML=demo.lines.map((line,i)=>{
    const cls=(i===demo.current?' current':'')+(i<demo.current?' executed':'');
    return `<div class="code-line${cls}" id="codeLine${i}">
      <span class="line-no">${i+1}</span><span class="line-text">${esc(line)||' '}</span>
    </div>`;
  }).join('');
  if(demo.current>=0){
    const el=document.getElementById('codeLine'+demo.current);
    if(el)el.scrollIntoView({block:'nearest'});
  }
  renderMemory();
  const c=document.getElementById('consoleView');
  if(c)c.textContent=demo.output.join('\n');
  const s=document.getElementById('stepStatus');
  if(s){
    s.className='feedback';
    s.textContent=demo.current<0?'按「逐步執行」開始，一次執行一行。':
      demo.current>=demo.lines.length?'✅ 程式執行完成！':'🟡 目前執行第 '+(demo.current+1)+' 行';
  }
}

function renderMemory(){
  const box=document.getElementById('memoryView');
  if(!box)return;
  const keys=Object.keys(demo.memory);
  box.innerHTML=keys.length?keys.map(k=>`<div class="memory-row"><span class="memory-name">${esc(k)}</span><span class="memory-value">${esc(formatValue(demo.memory[k]))}</span></div>`).join('')
  :'<div class="memory-empty">尚未建立變數</div>';
}

function formatValue(v){
  if(typeof v==='string')return '"'+v+'"';
  if(Array.isArray(v))return '['+v.map(x=>typeof x==='string'?`"${x}"`:String(x)).join(', ')+']';
  if(v===true)return 'True';
  if(v===false)return 'False';
  return String(v);
}

function setupInputBox(){
  const area=document.getElementById('inputArea');
  if(!area)return;
  if(state.unit===3 || units[state.unit].code.includes('input(')){
    area.innerHTML=`<div class="input-box">
      <b>⌨️ 程式需要輸入：</b>
      <input id="demoInput" placeholder="請輸入內容，例如：小明">
    </div>`;
  }else area.innerHTML='';
}

function evalValue(expr){
  expr=expr.trim();
  if(/^["'].*["']$/.test(expr))return expr.slice(1,-1);
  if(/^\d+\.\d+$/.test(expr))return Number(expr);
  if(/^\d+$/.test(expr))return Number(expr);
  if(expr==='True')return true;
  if(expr==='False')return false;
  if(expr.startsWith('[')&&expr.endsWith(']')){
    return expr.slice(1,-1).split(',').map(x=>evalValue(x.trim())).filter(x=>x!=='');
  }
  if(expr.startsWith('random.choice')){
    const choices=['寶物','敵人','朋友'];
    return choices[Math.floor(Math.random()*choices.length)];
  }
  if(Object.prototype.hasOwnProperty.call(demo.memory,expr))return demo.memory[expr];
  return expr.replace(/^["']|["']$/g,'');
}

function executeLine(i){
  let line=demo.lines[i];
  let trim=line.trim();

  if(!trim || trim.startsWith('#'))return;

  // input
  let m=trim.match(/^(\w+)\s*=\s*input\((.*)\)$/);
  if(m){
    const input=document.getElementById('demoInput');
    const val=input?input.value:'';
    demo.memory[m[1]]=val;
    return;
  }

  // import
  if(trim.startsWith('import '))return;

  // print
  m=trim.match(/^print\((.*)\)$/);
  if(m){
    let expr=m[1].trim();
    if((expr.startsWith('"')&&expr.endsWith('"'))||(expr.startsWith("'")&&expr.endsWith("'")))
      demo.output.push(expr.slice(1,-1));
    else if(expr.includes('+')){
      const parts=expr.split('+').map(evalValue);
      demo.output.push(parts.map(String).join(''));
    }else if(expr.startsWith('type(')){
      const n=expr.match(/^type\((\w+)\)$/);
      const v=n?demo.memory[n[1]]:null;
      demo.output.push(Array.isArray(v)?'<class \'list\'>':typeof v==='string'?'<class \'str\'>':typeof v==='number'?(Number.isInteger(v)?'<class \'int\'>':'<class \'float\'>'):'<class \'bool\'>');
    }else if(expr.startsWith('len(')){
      const n=expr.match(/^len\((\w+)\)$/);
      demo.output.push(String(n?String(demo.memory[n[1]]).length:0));
    }else if(expr.includes('[0]')){
      const n=expr.match(/^(\w+)\[0\]$/);
      demo.output.push(String(n?demo.memory[n[1]][0]:''));
    }else demo.output.push(formatValue(evalValue(expr)).replace(/^"|"$/g,''));
    return;
  }

  // list append
  m=trim.match(/^(\w+)\.append\((.*)\)$/);
  if(m){
    if(!Array.isArray(demo.memory[m[1]]))demo.memory[m[1]]=[];
    demo.memory[m[1]].push(evalValue(m[2]));
    return;
  }

  // random.choice
  m=trim.match(/^(\w+)\s*=\s*random\.choice\((.*)\)$/);
  if(m){demo.memory[m[1]]=evalValue('random.choice');return;}

  // decrement / arithmetic
  m=trim.match(/^(\w+)\s*=\s*(\w+)\s*-\s*(\d+)$/);
  if(m){demo.memory[m[1]]=Number(demo.memory[m[2]])-Number(m[3]);return;}

  // assignment
  m=trim.match(/^(\w+)\s*=\s*(.*)$/);
  if(m){demo.memory[m[1]]=evalValue(m[2]);return;}
}

function runDemo(){
  resetDemo();
  while(demo.current<demo.lines.length-1){
    demo.current++;
    executeLine(demo.current);
  }
  renderRunner();
}

function stepDemo(){
  if(demo.current>=demo.lines.length-1){
    const s=document.getElementById('stepStatus');
    if(s){s.className='feedback ok';s.textContent='✅ 已完成，再按「↺ 重設」可以重新觀察。';}
    return;
  }
  demo.current++;
  executeLine(demo.current);
  renderRunner();
}

function resetDemo(){
  demo={lines:units[state.unit].code.split('\n'),current:-1,memory:{},output:[],waitingInput:false};
  renderRunner();
  setupInputBox();
}

let pyodide=null;
let pyodidePromise=null;

function loadPyodideOnce(){
  if(pyodide) return Promise.resolve(pyodide);
  if(pyodidePromise) return pyodidePromise;
  pyodidePromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';
    s.onload=async()=>{
      try{
        pyodide=await loadPyodide();
        resolve(pyodide);
      }catch(e){reject(e)}
    };
    s.onerror=()=>reject(new Error('無法載入 Python 執行引擎'));
    document.head.appendChild(s);
  });
  return pyodidePromise;
}

function checkPracticeTask(code){
  const c=code.replace(/\s+/g,' ').toLowerCase();
  const checks=[
    [/print\s*\(/,"使用 print()"],
    [/[a-z_]\w*\s*=/,"建立變數"],
    [/print\s*\(/,"輸出內容"],
  ];
  let result=[];
  switch(state.unit){
    case 0: result=[/print\s*\(/i.test(code),/[a-z_]\w*\s*=/i.test(code),/print\s*\(/i.test(code)]; break;
    case 1: result=[(code.match(/^\s*[a-z_]\w*\s*=/gim)||[]).length>=2,/\d/.test(code),/print\s*\(/.test(code)]; break;
    case 2: result=[/(["']).*\1/.test(code),/type\s*\(/.test(code),/type\s*\(/.test(code)]; break;
    case 3: result=[/input\s*\(/.test(code),/[a-z_]\w*\s*=\s*input\s*\(/.test(code),/print\s*\(/.test(code)]; break;
    case 4: result=[/\bif\b/.test(code),/\bif\b.*:/.test(code),/print\s*\(/.test(code)]; break;
    case 5: result=[/\bif\b/.test(code),/\belif\b/.test(code),/\belse\s*:/.test(code)]; break;
    case 6: result=[/\bwhile\b/.test(code),/[a-z_]\w*\s*=/.test(code),/while[\s\S]*\n[\s\S]*print/.test(code)]; break;
    case 7: result=[/\bfor\b.+\bin\b/.test(code),/\[[^\]]*\]/.test(code),/print\s*\(/.test(code)]; break;
    case 8: result=[/[a-z_]\w*\s*=\s*["']/.test(code),/len\s*\(/.test(code),/\[[0-9]+\]/.test(code)]; break;
    case 9: result=[/[a-z_]\w*\s*=\s*\[/.test(code),/\.append\s*\(/.test(code),/len\s*\(|print\s*\(/.test(code)]; break;
    case 10: result=[/import\s+random/.test(code),/random\.choice\s*\(/.test(code),/print\s*\(/.test(code)]; break;
  }
  return result;
}

  state.codeRuns[state.unit]=(state.codeRuns[state.unit]||0)+1;
  save();
  showTaskCheck(code);
  setupPracticeInputs();
  if(st){st.className='exec-status';st.textContent='⏳ 正在啟動 Python 執行環境……';}
  if(out)out.textContent='';
  if(mem)mem.innerHTML='<div class="memory-empty">執行中……</div>';

  try{
    const py=await loadPyodide();
    let output='';
    const inputValue=document.getElementById('practiceInput')?.value || '';

    py.setStdout({batched:(s)=>{output+=s;}});
    py.setStderr({batched:(s)=>{output+=s;}});

    // input() 使用本單元輸入框；若未提供則使用空字串。
    py.setStdin({stdin:()=>inputValue});

    await py.runPythonAsync(code);

    if(out)out.textContent=output || '（程式執行完成，但沒有輸出內容）';

    const globals=py.globals;
    const names=[];
    try{
      const keys=globals.keys();
      for(const k of keys){
        if(typeof k==='string' && !k.startsWith('_') &&
           !['print','input','type','len','range','random'].includes(k)){
          names.push(k);
        }
      }
      if(keys && typeof keys.destroy==='function')keys.destroy();
    }catch(e){}
    const rows=[];
    for(const name of names){
      try{
        if(globals.has(name)){
          const v=globals.get(name);
          let val;
          if(v && typeof v.toJs==='function'){
            val=v.toJs();
            if(Array.isArray(val)) val='['+val.map(x=>typeof x==='string'?`"${x}"`:String(x)).join(', ')+']';
          }else val=String(v);
          rows.push(`<div class="memory-row"><span class="memory-name">${esc(name)}</span><span class="memory-value">${esc(pythonDisplayValue(val))}</span></div>`);
          if(v && typeof v.destroy==='function')v.destroy();
        }
      }catch(e){}
    }
    if(mem)mem.innerHTML=rows.length?rows.join(''):'<div class="memory-empty">目前沒有可顯示的主要變數</div>';
    if(st){st.className='exec-status ok';st.textContent='✅ Python 程式執行完成！';}

  }catch(err){
    if(out)out.textContent=String(err);
    if(st){st.className='exec-status bad';st.textContent='❌ 程式執行發生錯誤，請檢查紅字訊息。';}
    if(mem)mem.innerHTML='<div class="memory-empty">程式發生錯誤，暫不更新</div>';
  }
}

function challenge(i){
 const qs=[
  ['程式要顯示「皮卡丘出發！」，請填入：','print("皮卡丘出發！")'],
  ['讓 gems 儲存 20，請填入完整一行：','gems = 20'],
  ['哪一個是整數？','int'],
  ['請讓程式取得使用者輸入：','name = input("請輸入名字： ")'],
  ['當 rain 為 True 時，請寫出判斷的第一行：','if rain:'],
  ['請填入「否則」的關鍵字：','else'],
  ['while 的核心是：條件成立就 ______。','重複'],
  ['for item in items 中，item 會依序取得什麼？','items中的每個項目'],
  ['取得字串長度使用哪個函式？','len()'],
  ['在 bag 最後加入 "🍓"，使用哪個方法？','append()'],
  ['random.choice() 可以做什麼？','從多個選項中隨機選一個']
 ];
 let q=qs[i];
 if(i===2)return `<p>${q[0]}</p><div class="choice"><button onclick="quick('int')">int</button><button onclick="quick('str')">str</button><button onclick="quick('float')">float</button><button onclick="quick('bool')">bool</button></div><input type="hidden" id="answer">`;
 return `<p>${q[0]}</p><input id="answer" class="answer" value="${esc(state.answers[i]||'')}" placeholder="輸入你的答案">`;
}
function normalize(s){return String(s||'').replace(/\s+/g,'').replace(/["'“”]/g,'"').toLowerCase()}
function check(){
 const a=document.getElementById('answer'); if(!a)return;
 state.attempts=state.attempts||{};
 state.attempts[state.unit]=(state.attempts[state.unit]||0)+1;
 const val=a.value.trim(); state.answers[state.unit]=val;
 const expected=[
 'print("皮卡丘出發！")','gems=20','int','name=input("請輸入名字：")','ifrain:','else','重複','items中的每個項目','len()','append()','從多個選項中隨機選一個'
 ][state.unit];
 let ok=false;
 if(state.unit===2)ok=normalize(val)==='int';
 else if(state.unit===6)ok=['重複','repeat','繼續'].includes(val);
 else if(state.unit===7)ok=normalize(val).includes(normalize('items中的每個項目'))||val.includes('每個');
 else if(state.unit===10)ok=val.includes('隨機')||val.includes('random');
 else ok=normalize(val)===normalize(expected)|| (state.unit===3 && val.includes('input('));
 feedback.className='feedback '+(ok?'ok':'bad');
 feedback.textContent=ok?'🎉 答對了！皮卡丘獲得 10 分！':'再想一下～看看上面的範例與提示，再試一次！';
 if(ok && !state.done.includes(state.unit)){state.done.push(state.unit);state.score+=10;save();renderNav();scoreText.textContent=`目前 ${state.score} 分`;progressBar.style.width=((state.done.length/11)*100)+"%"}
 save();
}
function quick(v){document.getElementById('answer').value=v}
function hint(){feedback.className='feedback';feedback.textContent='💡 '+units[state.unit].tip}
function saveReflection(){
  state.reflection=document.getElementById('reflection').value;
  save();
  const f=document.getElementById('uploadFeedback');
  if(f){f.className='feedback ok';f.textContent='💾 已保存到這台裝置！';}
}

function getStudent(){
  return {
    className: document.getElementById('classInput')?.value.trim() || localStorage.getItem('pikaClass') || '',
    seat: document.getElementById('seatInput')?.value.trim() || localStorage.getItem('pikaSeat') || '',
    name: document.getElementById('nameInput')?.value.trim() || localStorage.getItem('pikaName') || ''
  };
}

function getGasUrl(){
  return (localStorage.getItem('pikaGasUrl') || GAS_URL || '').trim();
}

function buildPayload(){
  const s=getStudent();
  return {
    action:'unit_result',
    className:s.className,
    seat:s.seat,
    name:s.name,
    unit:state.unit+1,
    unitTitle:units[state.unit].title,
    goal:units[state.unit].goal,
    completed:state.done.includes(state.unit)?'是':'否',
    unitScore:state.done.includes(state.unit)?10:0,
    totalCompleted:state.done.length,
    totalScore:state.score,
    attempts:(state.attempts&&state.attempts[state.unit])||0,
    answer:(state.answers&&state.answers[state.unit])||'',
    reflection:document.getElementById('reflection')?.value || state.reflection || '',
    work:state.work || '',
    code:(state.studentCode&&state.studentCode[state.unit]) || document.getElementById('pythonEditor')?.value || '',
    codeRuns:(state.codeRuns&&state.codeRuns[state.unit]) || 0,
    taskCheck:JSON.stringify(checkPracticeTask((state.studentCode&&state.studentCode[state.unit]) || document.getElementById('pythonEditor')?.value || '')),
    seconds:Math.max(1,Math.round((Date.now()-unitStartedAt)/1000)),
    timestamp:new Date().toLocaleString('zh-TW')
  };
}

function uploadUnitResult(){
  const ed=document.getElementById('pythonEditor');
  if(ed){
    state.studentCode=state.studentCode||{};
    state.studentCode[state.unit]=ed.value;
  }
  state.reflection=document.getElementById('reflection')?.value || state.reflection || '';
  save();

  let url=getGasUrl();
  if(!url){
    url=prompt('請貼上 Google Apps Script 部署後的 /exec 網址：');
    if(!url)return;
    url=url.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
      alert('網址格式看起來不是 GAS 的 /exec 網址，請確認後再試一次。');
      return;
    }
    localStorage.setItem('pikaGasUrl',url);
  }

  const form=document.createElement('form');
  form.method='POST';
  form.action=url;
  form.target='pikaUploadFrame';
  form.style.display='none';

  const data=buildPayload();
  Object.entries(data).forEach(([k,v])=>{
    const input=document.createElement('input');
    input.type='hidden';
    input.name=k;
    input.value=String(v ?? '');
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
  form.remove();

  const f=document.getElementById('uploadFeedback');
  if(f){
    f.className='feedback ok';
    f.textContent='☁️ 已送出本單元學習成果！';
  }
}
